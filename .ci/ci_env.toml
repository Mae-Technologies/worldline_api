# CI test runner configuration
#
# env entries:
#   KEY=VALUE    — exported as-is in local dev and CI
#
# Service-specific host secrets (APP_DATABASE__HOST, APP_GRAPHDB__HOST) were
# for in-cluster Helm's Deep (dropped). Local int-test.sh uses testcontainers
# via MAE_TESTCONTAINERS. Remote GHA measures the same suite with that unset.
#
# coverage_threshold is the accepted line-coverage floor (llvm-cov --fail-under-lines).
# 85 is the healthy target: industry 80–90 band (Qt/LaunchDarkly "healthy"),
# Google 60/75/90 = acceptable/commendable/exemplary with project-wide >90
# "most likely not worth it". 0 skips llvm-cov (mae_macros). Existing crates
# may override downward with a "raise to 85" comment until tests/ suite catches up.
#
# Nominal 50 (measured 51.30% lines on nightly 1.101, 2026-09-28).
# Hit lines stayed 496, the same count as the 82.43% report on nightly 1.100
# (2026-09-13, worldline_api CI run 34874577287). This nightly attributes 435
# more profile.rs lines, all missed. Raise to 85 (worldline_api#1).

coverage_threshold = 50

engine = "cargo"
env = []
flags = ["--lib"]
