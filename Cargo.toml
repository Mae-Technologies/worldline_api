[package]
license = "MIT"
name = "worldline_api"
version = "0.1.0"
edition = "2024"
description = "Serde models for the Worldline NAM payment profiles and batch APIs"
readme = "README.md"
repository = "https://github.com/Mae-Technologies/worldline_api"
keywords = ["worldline", "payments", "merchant", "serde"]
categories = ["api-bindings", "encoding"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "2.0.3"
anyhow = "1.0.93"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"